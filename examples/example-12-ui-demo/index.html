<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MVAS - UI Demo</title>
  <link rel="stylesheet" href="./styles.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--chat-bg-color);
      min-height: 100vh;
      color: var(--chat-text-color);
    }
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--chat-border-color);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .mode-badge {
      background: var(--chat-accent-bg);
      color: var(--chat-accent-color);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 500;
    }
    #status {
      padding: 12px 20px;
      font-size: 0.85rem;
      color: var(--chat-muted-color);
      border-bottom: 1px solid var(--chat-border-color);
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
    }
    .controls {
      padding: 16px 20px;
      border-top: 1px solid var(--chat-border-color);
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .input-row {
      padding: 0 20px 12px;
    }
    #textInput {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid var(--chat-border-color);
      border-radius: 10px;
      font-size: 0.9rem;
      background: var(--chat-surface-color);
      color: var(--chat-text-color);
      outline: none;
      transition: all 0.2s;
      font-family: inherit;
    }
    #textInput::placeholder {
      color: var(--chat-muted-color);
    }
    #textInput:focus {
      border-color: var(--chat-accent-border);
      box-shadow: 0 0 0 2px var(--chat-accent-bg);
    }
    #recordBtn {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: var(--chat-accent-bg);
      border: 2px solid var(--chat-accent-border);
      color: var(--chat-accent-color);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #recordBtn:hover:not(:disabled) {
      background: var(--chat-accent-hover-bg);
    }
    #recordBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    #recordBtn.recording {
      background: var(--chat-warning-bg);
      border-color: var(--chat-warning-border);
      color: var(--chat-warning-color);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(255, 141, 87, 0.4); }
      50% { box-shadow: 0 0 0 10px rgba(255, 141, 87, 0); }
    }
    .input-hint {
      flex: 1;
      text-align: center;
      font-size: 0.85rem;
      color: var(--chat-muted-color);
    }
    #clearBtn {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: var(--chat-elevated-color);
      color: var(--chat-text-secondary);
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    #clearBtn:hover {
      background: var(--chat-border-color);
    }
    /* Tool detail modal styling */
    .tool-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .tool-modal {
      background: var(--chat-surface-color);
      border: 1px solid var(--chat-border-color);
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 80vh;
      overflow: auto;
    }
    .tool-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      border-bottom: 1px solid var(--chat-border-color);
    }
    .tool-modal-title {
      font-size: 15px;
      font-weight: 600;
      margin: 0;
    }
    .tool-modal-close {
      background: none;
      border: none;
      color: var(--chat-muted-color);
      cursor: pointer;
      padding: 4px 8px;
      font-size: 18px;
    }
    .tool-modal-body {
      padding: 16px;
    }
    .tool-detail-section {
      margin-bottom: 16px;
    }
    .tool-detail-section:last-child {
      margin-bottom: 0;
    }
    .tool-detail-section-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--chat-muted-color);
      margin: 0 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .tool-detail-pre {
      background: var(--chat-elevated-color);
      border-radius: 8px;
      padding: 12px;
      font-size: 13px;
      overflow-x: auto;
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Chat UI Demo</h1>
      <span class="mode-badge">UI Components</span>
    </header>

    <div id="status">Initializing...</div>

    <div id="chat-container"></div>

    <div class="input-row">
      <input type="text" id="textInput" placeholder="Type a message..." />
    </div>

    <div class="controls">
      <button id="recordBtn" disabled>
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" x2="12" y1="19" y2="22"/>
        </svg>
      </button>
      <span class="input-hint">Hold to speak or press Space</span>
      <button id="clearBtn">Clear</button>
    </div>
  </div>

  <div id="tool-modal" class="tool-modal-overlay" style="display: none;">
    <div class="tool-modal">
      <div class="tool-modal-header">
        <h2 class="tool-modal-title" id="tool-modal-title"></h2>
        <button class="tool-modal-close" id="tool-modal-close">×</button>
      </div>
      <div class="tool-modal-body" id="tool-modal-body"></div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
